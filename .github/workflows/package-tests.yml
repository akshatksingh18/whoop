name: protocol and analytics tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [protocol, analytics]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Resolve existing development dependencies
        run: dart pub get
      - name: Run the package's own complete suite
        run: dart test --concurrency=1 --reporter=expanded
