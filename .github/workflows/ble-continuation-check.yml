name: bounded productive sync verification

on:
  workflow_dispatch:
  push:
    branches: [ownership-ci-candidate-62, ownership-ci-candidate-64]

permissions:
  contents: read

concurrency:
  group: ble-continuation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ble-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - name: Guard reviewed source and personal payload contract
        run: |
          python3 tool/algorithm_contract.py
          python3 tool/personal_ios.py check
          flutter pub get
      - name: Analyze the whole candidate
        run: flutter analyze --no-fatal-infos
      - name: Verify continuation and retained safe trim and alarm contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ble-continuation-check
          flutter test --no-pub --concurrency=1 --coverage --coverage-path build/ble-continuation-check/targeted.lcov --reporter=expanded test/coverage_ble_productive_continuation_test.dart test/ble_safe_trim_test.dart test/gen5_bootstrap_official_test.dart test/history_task_safety_test.dart test/coverage_ble_durable_boundary_test.dart test/coverage_headless_durable_handoff_test.dart test/coverage_alarm_write_refusal_test.dart test/coverage_ble_clock_retry_alarm_test.dart test/coverage_app_commands_test.dart test/coverage_alarm_handoff_test.dart test/gen5_wiring_test.dart 2>&1 | tee build/ble-continuation-check/check.log
      - name: Retain targeted evidence separately from combined coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: targeted-ble-continuation-${{ github.sha }}
          path: build/ble-continuation-check/
          if-no-files-found: warn
