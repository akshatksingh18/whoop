name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Read-only: this job only builds and tests. Nothing here needs write access,
# and it executes code from pull requests.
permissions:
  contents: read

jobs:
  package-suites:
    uses: ./.github/workflows/package-tests.yml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't leave GITHUB_TOKEN in .git/config where PR-authored test code
          # could read it. Nothing in this job pushes back to the repo.
          persist-credentials: false

      - name: Personal iOS build contract
        run: |
          python3 -m unittest tool/test_personal_ios.py
          python3 tool/personal_ios.py check
          python3 -m unittest tool/test_coverage_gaps.py

      # PINNED, not `channel: stable`. Two reasons, both found the hard way when
      # this workflow first ran:
      #
      #  1. The repo does NOT currently build on Flutter 3.44.x. phosphor_flutter
      #     2.1.0 extends IconData, which became a `final class` in 3.44, so
      #     every widget test fails to compile:
      #       "The class 'IconData' can't be extended outside of its library
      #        because it's a final class."
      #     Upgrading past 3.41.x needs phosphor_flutter bumped or dropped first.
      #  2. CupertinoPageTransitionsBuilder moved between cupertino.dart and
      #     material.dart across those versions, so theme.dart's imports are
      #     version-sensitive too.
      #
      # A floating channel means the toolchain changes underneath an already
      # reviewed commit — the same reasoning as the commit-SHA pins for sibling
      # packages in pubspec.yaml. Bump this deliberately, with the phosphor
      # dependency sorted out in the same change.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # Inspect the committed monorepo paths, lock, reviewed revision manifest,
      # and algorithm provenance before dependency resolution. Shared with
      # personal-ios.yml.
      - name: Guard — in-tree package revisions and paths agree
        run: bash .github/scripts/check_sibling_pins.sh

      # Protocol and analytics resolve from the tracked packages/ source used by
      # local development and releases; no pubspec override is needed.
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # The imported analytics baseline has known info-only lints. Keep
        # warnings visible without reporting a compile failure.
        run: flutter analyze --no-fatal-infos

      # --concurrency=1: the suite uses sqflite_common_ffi against real database
      # files, and parallel workers race on them.
      #
      # The golden capture (whoop_hist.jsonl) is a real band recording kept
      # beside the repo rather than committed to it, so the two derivation-replay
      # tests SKIP here and run locally.
      - name: Test
        run: flutter test --concurrency=1 --coverage --reporter=expanded
      - name: Inventory execution gaps without hiding source
        if: always() && hashFiles('coverage/lcov.info') != ''
        run: python3 tool/coverage_gaps.py coverage/lcov.info --output coverage/gaps.json
      - name: Keep instrumented Dart line coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dart-line-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  synthetic-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      # These tests seed only synthetic data and assert overflow, range/route
      # state and full-scroll reachability. No golden baseline is required.
      - name: Render main pages, details, forms and failure states
        run: >-
          flutter test --concurrency=1 --dart-define=UI_CAPTURE=true
          test/build87_redesign_render_test.dart
          test/build95_repair_render_test.dart
          test/build98_nested_render_test.dart
          --reporter=expanded
      - name: Render barcode disclosure and reminder failure states
        run: >-
          flutter test --concurrency=1 --dart-define=UI_CAPTURE=true
          test/build99_barcode_test.dart test/build99_durability_test.dart
          test/build99_secondary_flows_test.dart
          --name 'barcode disclosure|Body nested states|month grid retains'
          --reporter=expanded
      - name: Render deeper read recovery and enlarged text
        # Include the deeper drill-down's read/retry and large-text repair.
        # Captures contain synthetic values only.
        run: flutter test --concurrency=1 --dart-define=UI_CAPTURE=true test/coverage_zones_test.dart test/coverage_settings_failure_test.dart --reporter=expanded
      - name: Render saved and legacy morning Recovery explanations
        run: flutter test --concurrency=1 --dart-define=UI_CAPTURE=true test/coverage_recovery_explanation_test.dart --reporter=expanded
      - name: Build local image index
        if: always()
        run: python3 tool/ui_smoke_gallery.py build/ui_capture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-ui-${{ github.sha }}
          path: build/ui_capture/
          if-no-files-found: error
          retention-days: 14
